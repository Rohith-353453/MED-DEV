[project]
name = "carefolio-api"
version = "0.1.0"
description = "Backend API for the AI Health Copilot prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0",
  "asyncpg>=0.30,<1.0",
  "aiosqlite>=0.20,<1.0",
  "alembic>=1.14,<2.0",
  "python-multipart>=0.0.17,<1.0",
  "httpx>=0.27,<1.0",
  "aiohttp>=3.9,<4.0",
  "azure-storage-blob>=12.24,<13.0",
  "azure-storage-queue>=12.12,<13.0",
  "azure-identity>=1.19,<2.0",
  "openai>=1.55,<2.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "pypdf>=5.1,<6.0",
  "azure-monitor-opentelemetry>=1.6,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.txt"]

[project.optional-dependencies]
dev = ["ruff>=0.8,<1.0", "pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<1.0", "httpx>=0.27,<1.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
