name: Deploy backend to Azure Container Apps

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      AZURE_API_BASE_URL: ${{ vars.AZURE_API_BASE_URL }}
      FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment configuration
        shell: bash
        run: |
          for name in AZURE_RESOURCE_GROUP AZURE_CONTAINER_APP_NAME AZURE_CONTAINER_REGISTRY AZURE_API_BASE_URL FRONTEND_ORIGIN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure the GitHub Actions variable $name before deploying."
              exit 1
            fi
          done
          if [[ "$FRONTEND_ORIGIN" != "https://white-island-0d7509300.1.azurestaticapps.net" ]]; then
            echo "::error::FRONTEND_ORIGIN must exactly match the deployed Static Web App origin."
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push backend image
        id: image
        working-directory: backend
        shell: bash
        run: |
          login_server="$(az acr show --name "$AZURE_CONTAINER_REGISTRY" --query loginServer --output tsv)"
          image="$login_server/carefolio-api:$GITHUB_SHA"
          az acr build \
            --registry "$AZURE_CONTAINER_REGISTRY" \
            --image "carefolio-api:$GITHUB_SHA" \
            --file Dockerfile \
            .
          echo "reference=$image" >> "$GITHUB_OUTPUT"

      - name: Update Container App image
        shell: bash
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          az containerapp update \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE_REFERENCE" \
            --output none

      - name: Verify health and CORS preflight
        shell: bash
        run: |
          api_base="${AZURE_API_BASE_URL%/}"
          healthy=false
          for attempt in {1..18}; do
            if curl --silent --show-error --fail "$api_base/health/ready" --output /dev/null; then
              healthy=true
              break
            fi
            sleep 10
          done
          if [[ "$healthy" != true ]]; then
            echo "::error::Container App did not become healthy after deployment."
            exit 1
          fi

          headers_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --dump-header "$headers_file" \
            --output /dev/null \
            --write-out "%{http_code}" \
            --request OPTIONS \
            "$api_base/api/documents/preflight-check/summaries" \
            --header "Origin: $FRONTEND_ORIGIN" \
            --header "Access-Control-Request-Method: POST" \
            --header "Access-Control-Request-Headers: authorization,content-type")"
          allow_origin="$(awk 'tolower($1) == "access-control-allow-origin:" { sub(/\r$/, "", $2); print $2 }' "$headers_file")"
          allow_methods="$(awk 'tolower($1) == "access-control-allow-methods:" { print tolower($0) }' "$headers_file")"
          allow_headers="$(awk 'tolower($1) == "access-control-allow-headers:" { print tolower($0) }' "$headers_file")"
          if [[ "$status" != 200 ]] \
            || [[ "$allow_origin" != "$FRONTEND_ORIGIN" ]] \
            || [[ "$allow_methods" != *post* ]] \
            || [[ "$allow_headers" != *authorization* ]] \
            || [[ "$allow_headers" != *content-type* ]]; then
            cat "$headers_file"
            echo "::error::CORS preflight failed for the configured frontend origin."
            exit 1
          fi
          rm -f "$headers_file"
